<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>FY2027 Work Calendar | 3.2 CYD preview</title><style>
:root{--blue:#005dab;--red:#e51937;--navy:#002f5f;--pale:#eef3f8;--ink:#18293f;--border:#d1dde7}
*{box-sizing:border-box}body{margin:0;background:#eaf0f7;font-family:Arial,Helvetica,sans-serif;color:#1a3652;display:flex;flex-direction:column;align-items:center;padding:24px;gap:12px}h1{font-size:22px;margin:0}p{font-size:13px;max-width:650px;text-align:center;line-height:1.5;margin:0}.pill{padding:6px 12px;background:white;border-radius:6px;border:1px solid var(--border);font-weight:800;color:var(--navy)}

.edit{position:absolute;inset:0;background:white;display:none}.edit.show{display:block}.edith{height:38px;border-top:4px solid var(--red);background:var(--blue);display:flex;align-items:center;justify-content:space-between;color:white;padding:0 4px;font-size:13px;font-weight:900}.edith button{height:27px;padding:0 7px;background:var(--navy);color:white;border-radius:4px;border:0;font-size:11px;font-weight:900}.note{position:absolute;top:42px;left:5px;width:310px;height:46px;border:1px solid var(--border);border-radius:4px;background:var(--pale);font-size:12px;font-family:Arial;padding:4px;resize:none;color:var(--ink);font-weight:bold}.keys{position:absolute;left:0;right:0;top:93px}.keyrow{display:flex;justify-content:center;gap:3px;margin-bottom:4px}.keyrow button{height:29px;min-width:0;background:var(--pale);border-radius:4px;border:0;color:var(--ink);font-weight:900;font-size:13px}.bottom{position:absolute;top:194px;left:4px;right:4px;display:flex;gap:6px}.bottom button{height:42px;border-radius:4px;border:0;font-weight:900;background:var(--pale)}.bottom button:nth-child(1){width:54px;background:var(--navy);color:white}.bottom button:nth-child(2){flex:1}.bottom button:nth-child(3){width:73px;background:var(--red);color:white}.count{font-size:8px;position:absolute;right:7px;top:88px;color:var(--navy)}button{cursor:pointer;touch-action:manipulation}
</style></head><body><h1>FY2027 · CYD 3.2″ Interactive Preview</h1><div class="pill">320 × 240 landscape · Monday-first</div><p>Tap a date to edit a note. Hold a date for 650 ms (or right-click) to choose Blue, Red, or Clear. Preview entries are stored only in this browser.</p>
<div id="device"><div id="screen"><div class="strip"></div><div class="head"><div><h2 id="title"></h2><small id="range"></small></div><div class="arrows"><button id="prev">‹</button><button id="next">›</button></div></div><div class="weekdays"><span>MON</span><span>TUE</span><span>WED</span><span>THU</span><span>FRI</span><span>SAT</span><span>SUN</span></div><div class="days" id="days"></div><div class="foot">TAP: NOTE &nbsp; HOLD: COLOR &nbsp; 13 PERIODS</div><div class="overlay" id="overlay"><div class="dialog"><h3 id="colorlabel"></h3><div class="choices"><button class="blue" data-color="blue">BLUE</button><button class="red" data-color="red">RED</button><button class="clear" data-color="">CLEAR</button></div><button class="cancel" id="cancel">CANCEL</button></div></div><div class="edit" id="edit"><div class="edith"><button id="back">BACK</button><span id="editdate"></span><button id="save">SAVE</button></div><textarea class="note" id="note" maxlength="96" placeholder="TYPE A NOTE..."></textarea><div class="keys" id="keyboard"></div><div class="bottom"><button id="num">123</button><button id="space">SPACE</button><button id="delete">BACK</button></div><div class="count" id="count">0/96</div></div></div></div>
<script>
const $=s=>document.querySelector(s),UTC=(y,m,d)=>new Date(Date.UTC(y,m,d)),start0=UTC(2026,7,31),MONTH=['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];let fy=2027,p=4,chosen=null,numbers=false;const db=JSON.parse(localStorage.getItem('fy27_cyd32_preview')||'{}');const iso=d=>d.toISOString().slice(0,10),add=(d,n)=>new Date(d.getTime()+86400000*n),fmt=(d,year=false)=>`${MONTH[d.getUTCMonth()]} ${d.getUTCDate()}${year?', '+d.getUTCFullYear():''}`,begin=()=>add(start0,(fy-2027)*364+(p-1)*28);function store(){localStorage.setItem('fy27_cyd32_preview',JSON.stringify(db))}function scale(){document.querySelector('#screen').style.transform=`scale(${document.querySelector('#device').clientWidth/320})`}addEventListener('resize',scale);scale();
function render(){const a=begin();$('#title').textContent=`FY${String(fy).slice(-2)} P${String(p).padStart(2,'0')}`;$('#range').textContent=`${fmt(a)} - ${fmt(add(a,27))}`;$('#days').replaceChildren();for(let i=0;i<28;i++){const d=add(a,i),id=iso(d),e=db[id]||{},c=document.createElement('div');c.className='day '+(e.color||'');c.tabIndex=0;c.setAttribute('role','button');c.setAttribute('aria-label',`${fmt(d,true)}; ${e.color||'unmarked'}; ${e.note?'note saved':'no note'}`);c.innerHTML=`<strong>${d.getUTCDate()}</strong>${i%7===0?`<span class="week">W${Math.floor(i/7)+1}</span>`:''}${d.getUTCDate()===1?`<span class="month">${MONTH[d.getUTCMonth()]}</span>`:''}${e.note?'<span class="dot"></span>':''}`;
let held=false,timer=null;const note=()=>{chosen=id;$('#editdate').textContent=fmt(d,true);$('#note').value=e.note||'';numbers=false;drawKeys();updateCount();$('#edit').classList.add('show')};const pick=()=>{chosen=id;$('#colorlabel').textContent='COLOR '+fmt(d);$('#overlay').classList.add('show')};c.onpointerdown=()=>{held=false;clearTimeout(timer);timer=setTimeout(()=>{held=true;pick()},650)};c.onpointerup=()=>{clearTimeout(timer);if(!held)note()};c.onpointercancel=()=>clearTimeout(timer);c.oncontextmenu=evt=>{evt.preventDefault();held=true;clearTimeout(timer);pick()};c.onkeydown=e=>{if(e.key==='Enter')note();if(e.key===' '){e.preventDefault();pick()}};$('#days').append(c);}}
$('#prev').onclick=()=>{p--;if(p===0){p=13;fy--}render()};$('#next').onclick=()=>{p++;if(p===14){p=1;fy++}render()};$('#cancel').onclick=()=>$('#overlay').classList.remove('show');document.querySelectorAll('[data-color]').forEach(b=>b.onclick=()=>{db[chosen]??={};db[chosen].color=b.dataset.color;store();$('#overlay').classList.remove('show');render()});$('#back').onclick=()=>$('#edit').classList.remove('show');$('#save').onclick=()=>{db[chosen]??={};db[chosen].note=$('#note').value.toUpperCase().trim().slice(0,96);store();$('#edit').classList.remove('show');render()};function updateCount(){$('#count').textContent=$('#note').value.length+'/96'}$('#note').oninput=updateCount;
function append(ch){if($('#note').value.length>=96)return;$('#note').value+=ch;updateCount()}function drawKeys(){const rows=numbers?['1234567890','-/. :&#()','?!+=%$@']:['QWERTYUIOP','ASDFGHJKL','ZXCVBNM'];$('#keyboard').replaceChildren();for(let r=0;r<3;r++){const row=document.createElement('div');row.className='keyrow';let w=r===0?28:r===1?30:37;for(const char of rows[r]){const b=document.createElement('button');b.textContent=char===' '?'·':char;b.style.width=w+'px';b.onclick=()=>append(char);row.append(b)}$('#keyboard').append(row)}$('#num').textContent=numbers?'ABC':'123'}$('#num').onclick=()=>{numbers=!numbers;drawKeys()};$('#space').onclick=()=>append(' ');$('#delete').onclick=()=>{$('#note').value=$('#note').value.slice(0,-1);updateCount()};render();
</script></body></html>
