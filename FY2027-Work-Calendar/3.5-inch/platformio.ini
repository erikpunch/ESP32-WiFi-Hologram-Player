; FY2027 Work Calendar for 3.5-inch ESP32-3248S035R / S035C
; No Arduino IDE required: PlatformIO or GitHub Actions compiles firmware.
[env]
platform = espressif32@6.10.0
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
board_build.partitions = default.csv
lib_deps = lovyan03/LovyanGFX@1.2.36
build_flags =
  -DCORE_DEBUG_LEVEL=0

[env:cyd35r]
; ESP32-3248S035R: XPT2046 resistive touch
build_flags = ${env.build_flags} -DCYD_RESISTIVE=1

[env:cyd35c]
; ESP32-3248S035C: GT911 capacitive touch
build_flags = ${env.build_flags} -DCYD_CAPACITIVE=1
